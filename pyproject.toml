[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-description"
dynamic = ["version"]
description = "Every drone the Swarm simulator flies: URDFs, meshes and parameters, one folder each"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Swarm" }
]
keywords = [
  "autonomous-drones",
  "pybullet",
  "simulation",
  "swarm",
  "urdf",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/swarm-subnet/swarm-description"
Repository = "https://github.com/swarm-subnet/swarm-description"
Issues = "https://github.com/swarm-subnet/swarm-description/issues"

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["swarm_description*"]

[tool.setuptools.package-data]
swarm_description = ["*/*.urdf", "*/*.toml", "*/*.md", "*/meshes/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.setuptools.dynamic]
version = { attr = "swarm_description.__version__" }

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
