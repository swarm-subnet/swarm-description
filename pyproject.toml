[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarm-description"
dynamic = ["version"]
description = "Every drone the Swarm simulator flies: URDFs, meshes and parameters, one folder each"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Swarm" }
]
keywords = [
  "autonomous-drones",
  "pybullet",
  "simulation",
  "swarm",
  "urdf",
]
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Homepage = "https://github.com/swarm-subnet/swarm-description"
Repository = "https://github.com/swarm-subnet/swarm-description"
Issues = "https://github.com/swarm-subnet/swarm-description/issues"

[dependency-groups]
dev = [
  "mypy>=1.13",
  "pre-commit>=4",
  "pytest>=8",
  "pytest-cov>=6",
  "ruff>=0.8",
  "swarm-bullet3==2.0.0.5",  # the engine the simulator flies, for the load tests
]

[tool.setuptools]
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.packages.find]
include = ["swarm_description*"]

[tool.setuptools.package-data]
swarm_description = ["*/*.urdf", "*/*.toml", "*/*.md", "*/meshes/*"]

[tool.setuptools.exclude-package-data]
"*" = ["__pycache__/*", "*.py[cod]"]

[tool.setuptools.dynamic]
version = { attr = "swarm_description.__version__" }

[tool.ruff]
line-length = 200
target-version = "py311"

[tool.ruff.format]
exclude = ["*.md"]  # README examples keep their aligned comments

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["swarm_description", "tests"]

[[tool.mypy.overrides]]
module = ["pybullet"]  # ships no type information
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
